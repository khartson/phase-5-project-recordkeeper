---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/comments":
    post:
      summary: create comment
      tags:
      - Comments
      parameters: []
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Comment"
        '422':
          description: invalid post
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                post_id:
                  type: integer
              required:
              - content
              - post_id
  "/comments/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    patch:
      summary: update comment
      tags:
      - Comments
      parameters: []
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Comment"
        '403':
          description: not the owner
        '404':
          description: comment not found
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
              required:
              - content
    delete:
      summary: delete comment
      tags:
      - Comments
      responses:
        '204':
          description: no content
        '403':
          description: not the owner
        '404':
          description: comment not found
  "/posts":
    get:
      summary: posts feed
      responses:
        '200':
          description: successful
    post:
      summary: create post
      responses:
        '200':
          description: successful
  "/users":
    get:
      summary: users feed
      responses:
        '200':
          description: successful
    post:
      summary: create user
      responses:
        '200':
          description: successful
  "/tags":
    get:
      summary: tags feed
      responses:
        '200':
          description: successful
  "/posts/{id}":
    parameters:
    - name: id
      in: path
      description: id
      required: true
      schema:
        type: string
    get:
      summary: show post
      responses:
        '200':
          description: successful
    patch:
      summary: update post
      responses:
        '200':
          description: successful
    put:
      summary: update post
      responses:
        '200':
          description: successful
    delete:
      summary: delete post
      responses:
        '200':
          description: successful
  "/search":
    get:
      summary: search search
      responses:
        '200':
          description: successful
  "/signup":
    post:
      summary: signup session
      responses:
        '200':
          description: successful
  "/me":
    get:
      summary: me session
      responses:
        '200':
          description: successful
  "/login":
    post:
      summary: login session
      responses:
        '200':
          description: successful
  "/logout":
    delete:
      summary: logout session
      responses:
        '200':
          description: successful
  "/users/{id}":
    parameters:
    - name: id
      in: path
      description: id
      required: true
      schema:
        type: string
    get:
      summary: show user
      responses:
        '200':
          description: successful
    patch:
      summary: update user
      responses:
        '200':
          description: successful
    put:
      summary: update user
      responses:
        '200':
          description: successful
  "/change_password":
    patch:
      summary: change_password user
      responses:
        '200':
          description: successful
  "/new_icon":
    patch:
      summary: new_icon user
      responses:
        '200':
          description: successful
  "/delete_account":
    delete:
      summary: delete_account user
      responses:
        '200':
          description: successful
servers:
- url: https://{defaultHost}
  variables:
    defaultHost:
      default: localhost:3000
components:
  schemas:
    Comment:
      type: object
      properties:
        id:
          type: integer
        content:
          type: string
        created_at:
          type: string
          format: date-time
        user:
          type: object
          properties:
            id:
              type: integer
            username:
              type: string
            icon:
              type: string
              nullable: true
      required:
      - id
      - content
      - created_at
      - user
